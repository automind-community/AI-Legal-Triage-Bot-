[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-bot"
version = "0.1.0"
description = "FastAPI-based Legal RAG chatbot over US Federal Code using FAISS, dinghy-law-0.6b, and Groq llama-3.1-8b-instant."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Legal AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.9.0",
    "datasets>=2.19.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]
eval = [
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
